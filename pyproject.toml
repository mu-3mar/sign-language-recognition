[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-language-recognition"
version = "1.0.0"
description = "Real-time American Sign Language recognition using MediaPipe and PyTorch."
requires-python = ">=3.10,<3.13"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.setuptools]
packages = ["slr", "scripts", "training"]
